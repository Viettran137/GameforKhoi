<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thám tử đọc hiểu</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   THÁM TỬ ĐỌC HIỂU — game đọc hiểu cho bé ~10 tuổi
   Thiết kế riêng cho bé tự kỷ:
   • Mỗi đoạn truyện có MỘT HÌNH MINH HOẠ · đáp án cũng có hình
   • Màu dịu, không nhấp nháy, không hiệu ứng mạnh
   • KHÔNG tính giờ → bé đọc bao lâu tùy thích
   • Trả lời sai KHÔNG bị phạt, không dấu X đỏ → chỉ gợi ý nhẹ nhàng
   • Bố cục cố định: hình + đoạn văn bên trái, câu hỏi bên phải
   • Luôn thấy còn bao nhiêu gợi ý nữa → bé biết trước điều sắp xảy ra
   • Bật/tắt âm thanh dễ dàng (nhiều bé nhạy cảm với tiếng động)
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#2E3D50; --ink2:#5B6B80; --ink3:#8A99AC;
  --line:#E6DFD3; --accent:#4B7BA8; --accent-soft:#E8F0F7;
  --ok:#5B9E7E; --ok-soft:#E6F2EC; --hint:#C98A3C; --hint-soft:#FBF0DF;
  --radius:18px; --shadow:0 2px 10px rgba(46,61,80,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:19px; line-height:1.75; letter-spacing:.2px;
  -webkit-font-smoothing:antialiased; padding:16px;
  display:flex; flex-direction:column; align-items:center;
}
.wrap{width:100%; max-width:1080px; margin:auto}
button{font-family:inherit; font-size:inherit; cursor:pointer; border:none; background:none; color:inherit}
button:focus-visible{outline:3px solid var(--accent); outline-offset:3px}

/* ── Thanh trên: vị trí CỐ ĐỊNH ở mọi màn hình ── */
.topbar{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap}
.topbar h1{font-size:20px; font-weight:800; letter-spacing:.3px; flex:1; min-width:180px}
.iconbtn{
  display:flex; align-items:center; gap:8px; background:var(--card); border:2px solid var(--line);
  border-radius:999px; padding:8px 16px; font-size:15px; font-weight:700; color:var(--ink2); box-shadow:var(--shadow);
}
.iconbtn:hover{border-color:var(--accent); color:var(--accent)}

.card{background:var(--card); border:2px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}

/* ── Màn hình bắt đầu ── */
.start{text-align:center; padding:40px 28px}
.start h2{font-size:34px; font-weight:800; margin:16px 0 10px; letter-spacing:.3px}
.start p{color:var(--ink2); max-width:520px; margin:0 auto 10px}
.bigbtn{
  background:var(--accent); color:#fff; font-size:24px; font-weight:800;
  padding:20px 52px; border-radius:999px; margin-top:24px; box-shadow:0 4px 0 #3B6389;
}
.bigbtn:hover{background:#3F6B94}
.bigbtn:active{transform:translateY(2px); box-shadow:0 2px 0 #3B6389}
.calmnote{
  display:inline-block; margin-top:20px; background:var(--accent-soft); color:var(--accent);
  border-radius:14px; padding:12px 20px; font-size:16px; font-weight:600;
}
.modes{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
.bigbtn.alt{background:var(--ok); box-shadow:0 4px 0 #4A836A}
.bigbtn.alt:hover{background:#4F8C6F}
.bigbtn.alt:active{box-shadow:0 2px 0 #4A836A}
.modehint{font-size:15px; color:var(--ink3); margin-top:14px; line-height:1.7}
/* Ảnh bìa 2 vụ án ở màn hình đầu — bé nhìn hình là biết sắp chơi gì */
.covers{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:24px}
.cover{width:180px}
.cover .pic{width:100%; height:120px; background:#F4EFE6; border:2px solid var(--line); border-radius:14px; overflow:hidden}
.cover .cap{font-size:14.5px; font-weight:700; color:var(--ink2); margin-top:7px}

.hero{width:126px; height:126px; margin:0 auto}
.hero-sm{width:70px; height:70px; flex:none}

/* ── Khu chơi: TRÁI = hình + đoạn văn · PHẢI = câu hỏi ── */
.play{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}
.panel{padding:22px 24px}
.panel-title{
  display:flex; align-items:center; gap:9px; font-size:15px; font-weight:800;
  color:var(--ink3); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px;
}
/* Hình minh hoạ của đoạn truyện đang đọc */
.scenepic{
  width:100%; height:200px; background:#F4EFE6; border:2px solid var(--line);
  border-radius:14px; margin-bottom:16px; overflow:hidden;
}
.scenepic svg{display:block; width:100%; height:100%}
.story p{margin-bottom:14px}
.story p:last-child{margin-bottom:0}
.story .s{border-radius:6px; padding:2px 3px; margin:0 -3px; transition:background .45s ease}
.story .s.lit{background:#FCEFD4; box-shadow:0 0 0 2px #F2DCAE}
.newtag{
  display:inline-block; background:var(--accent-soft); color:var(--accent); font-size:13px;
  font-weight:800; border-radius:8px; padding:1px 9px; margin-right:8px; vertical-align:2px;
}
.question{font-size:22px; font-weight:800; line-height:1.55; margin-bottom:18px}

/* ── Đáp án (có hình + chữ) ── */
.opts{display:flex; flex-direction:column; gap:12px}
.opt{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  background:#fff; border:2.5px solid var(--line); border-radius:14px; padding:12px 16px; font-weight:600;
}
.opt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .kbd{
  flex:none; width:36px; height:36px; border-radius:11px; background:var(--accent-soft);
  color:var(--accent); font-weight:800; display:flex; align-items:center; justify-content:center;
}
.opt .optpic{
  flex:none; width:58px; height:58px; background:#F6F1E8; border:2px solid var(--line);
  border-radius:11px; overflow:hidden;
}
.opt .optpic svg{display:block; width:100%; height:100%}
/* Đúng = xanh lá dịu. Sai = KHÔNG dùng đỏ, chỉ mờ nhẹ → không tạo cảm giác bị phạt */
.opt.correct{border-color:var(--ok); background:var(--ok-soft)}
.opt.correct .kbd{background:var(--ok); color:#fff}
.opt.tried{opacity:.5}
.opt.tried .kbd{background:#EFEAE1; color:var(--ink3)}

.feedback{margin-top:18px; border-radius:14px; padding:16px 18px; font-weight:600; display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft); color:#2F6B52; border:2px solid #BEDCCC}
.feedback.hint{background:var(--hint-soft); color:#8A5A16; border:2px solid #EFD9B4}
.nextbtn{
  display:none; width:100%; margin-top:16px; background:var(--ok); color:#fff;
  font-size:21px; font-weight:800; padding:16px; border-radius:14px; box-shadow:0 4px 0 #4A836A;
}
.nextbtn.show{display:block}
.nextbtn:active{transform:translateY(2px); box-shadow:0 2px 0 #4A836A}

/* ── Tiến trình (luôn ở DƯỚI CÙNG, không đổi chỗ) ── */
.progress{margin-top:18px; padding:16px 22px}
.progress-top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:11px}
.progress-label{font-weight:800}
.dots{display:flex; gap:9px; flex-wrap:wrap; justify-content:flex-end}
.dots.many{gap:6px; max-width:320px}
.dots.many .dot{width:12px; height:12px; border-width:2px}
.dot{width:17px; height:17px; border-radius:50%; background:#EBE4D8; border:2px solid #DDD4C5}
.dot.done{background:var(--ok); border-color:var(--ok)}
.dot.now{background:#fff; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.notebook{font-size:15.5px; color:var(--ink2); border-top:2px dashed var(--line); padding-top:11px; margin-top:4px}
.notebook b{color:var(--ink)}
.notebook li{margin-left:22px; margin-top:5px}

/* ── Kết thúc ── */
.end{text-align:center; padding:40px 28px}
.end h2{font-size:31px; font-weight:800; margin:16px 0 12px; color:var(--ok)}
.endpic{width:280px; height:220px; margin:0 auto; background:#F4EFE6; border:2px solid var(--line); border-radius:18px; overflow:hidden}
.endpic svg{display:block; width:100%; height:100%}
.endrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:26px}
.btn2{background:var(--card); border:2.5px solid var(--accent); color:var(--accent); font-weight:800; padding:15px 30px; border-radius:999px}
.btn2:hover{background:var(--accent-soft)}
.btn2.primary{background:var(--accent); color:#fff}
.btn2.primary:hover{background:#3F6B94}

.hide{display:none !important}

@media (max-width:860px){
  body{font-size:18px; padding:12px}
  .play{grid-template-columns:1fr}
  .start h2{font-size:28px}
  .question{font-size:20px}
  .scenepic{height:180px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>🔍 Thám tử đọc hiểu</h1>
    <button class="iconbtn" id="musicBtn" onclick="toggleMusic()" aria-label="Bật hoặc tắt nhạc nền">
      <span id="musicIcon">🎵</span><span id="musicText">Nhạc: Bật</span>
    </button>
    <button class="iconbtn" id="soundBtn" onclick="toggleSound()" aria-label="Bật hoặc tắt tiếng khen và giọng đọc">
      <span id="soundIcon">🔔</span><span id="soundText">Âm thanh: Bật</span>
    </button>
  </div>

  <!-- ══ BẮT ĐẦU ══ -->
  <div class="card start" id="screenStart">
    <div class="hero" id="heroStart"></div>
    <h2>Thám tử đọc hiểu</h2>
    <p>Chào bạn! Mình là Kính Lúp.</p>
    <p>Chúng ta sẽ cùng đọc truyện, xem hình và tìm ra câu trả lời nhé.</p>
    <div class="calmnote">
      🕊️ Không tính giờ. Bạn cứ đọc thật kỹ.<br>
      Chọn sai cũng không sao, mình sẽ giúp bạn.
    </div>
    <div class="covers" id="coversBox"></div>
    <div class="modes">
      <button class="bigbtn" onclick="startGame()">🔍 Vụ án có cốt truyện</button>
      <button class="bigbtn alt" onclick="startPractice()">⭐ Vòng luyện tập</button>
    </div>
    <div class="modehint" id="modeHint"></div>
  </div>

  <!-- ══ CHƠI ══ -->
  <div id="screenPlay" class="hide">
    <div class="play">
      <div class="card panel">
        <div class="panel-title">📖 Câu chuyện</div>
        <div class="scenepic" id="scenePic"></div>
        <div class="story" id="storyBox"></div>
      </div>
      <div class="card panel">
        <div class="panel-title">❓ Câu hỏi</div>
        <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:6px">
          <div class="hero-sm" id="heroPlay"></div>
          <div class="question" id="questionBox"></div>
        </div>
        <div class="opts" id="optsBox"></div>
        <div class="feedback" id="feedbackBox" role="status" aria-live="polite"></div>
        <button class="nextbtn" id="nextBtn" onclick="nextScene()">Tiếp theo →</button>
      </div>
    </div>
    <div class="card progress">
      <div class="progress-top">
        <div class="progress-label" id="progressLabel"></div>
        <div class="dots" id="dotsBox"></div>
      </div>
      <div class="notebook" id="notebookBox"></div>
    </div>
  </div>

  <!-- ══ KẾT THÚC ══ -->
  <div class="card end hide" id="screenEnd">
    <div class="endpic" id="endArt"></div>
    <h2 id="endTitle">Chúc mừng bạn!</h2>
    <p id="endText" style="color:var(--ink2);max-width:560px;margin:0 auto"></p>
    <div class="notebook" id="endNotebook" style="max-width:560px;margin:22px auto 0;text-align:left"></div>
    <div class="endrow" id="endButtons"></div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PHẦN 1 — THƯ VIỆN HÌNH VẼ (SVG viết thẳng trong file)
   Không dùng file ảnh rời ⇒ game vẫn chạy offline, copy đi đâu cũng được.
   Nguyên tắc vẽ cho bé tự kỷ:
     • Hình đơn giản, ít chi tiết thừa, nền trơn → không gây quá tải thị giác
     • Nhân vật GIỮ NGUYÊN hình dáng ở mọi cảnh → bé nhận ra ngay
     • Nét mặt hiền, trung tính, không cường điệu
     • Không dùng màu chói, không nhấp nháy
   ═══════════════════════════════════════════════════════════════════════ */
const K = {
  bear:'#A9743F', bearD:'#8B5D31', muzzle:'#DCB98A', dark:'#3A2A1C',
  rab:'#EDE7DD', rabD:'#D8D0C2', pink:'#EFB4B4',
  cat:'#E9A05C', catD:'#CE8443',
  wood:'#C08B5C', woodD:'#9E7047', grass:'#8FB87A', grassD:'#7A9E67',
  water:'#7FB3D5', grey:'#9AA6B4', greyD:'#7C8896',
  bag:'#6B8CA8', bagD:'#55708A', paper:'#FFFFFF', sky:'#EAF2F8', line:'#E6DFD3',
};
const HAT = { red:['#CE5540','#A9412F'], blue:['#4B7BA8','#3A6086'], yellow:['#E4B84D','#C29A34'] };
const PEN = { blue:['#3E8FA8','#2F7189'], pink:['#E48FA8','#C5748C'], black:['#4A5462','#333B47'] };

/* ── Các mảnh ghép dùng lại nhiều lần ── */
const P = {};

// Chiếc mũ (dùng cho cả mũ rời lẫn mũ đội trên đầu)
P.hat = (x, y, s, col) => {
  const c = HAT[col] || HAT.red;
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    + '<path d="M-20 0 Q-20 -27 0 -27 Q20 -27 20 0 Z" fill="'+c[0]+'"/>'
    + '<rect x="-20" y="-9" width="40" height="9" fill="'+c[1]+'"/>'
    + '<ellipse cx="0" cy="0" rx="31" ry="7.5" fill="'+c[0]+'"/>'
    + '</g>';
};

// Bác Gấu. hatCol = null → không đội mũ. mood: 'sad' | 'happy' | 'calm'
P.bear = (x, y, s, hatCol, mood) => {
  const eyes = '<circle cx="-12" cy="-5" r="3.6" fill="'+K.dark+'"/><circle cx="12" cy="-5" r="3.6" fill="'+K.dark+'"/>';
  const mouth = mood === 'happy'
    ? '<path d="M-9 16 q9 9 18 0" stroke="'+K.dark+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
    : (mood === 'sad'
      ? '<path d="M-8 19 q8 -6 16 0" stroke="'+K.dark+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
      : '<path d="M-8 16 q8 6 16 0" stroke="'+K.dark+'" stroke-width="2.6" fill="none" stroke-linecap="round"/>');
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    + '<ellipse cx="0" cy="74" rx="38" ry="32" fill="'+K.bear+'"/>'            // thân
    + '<ellipse cx="0" cy="80" rx="21" ry="20" fill="'+K.muzzle+'" opacity=".5"/>'
    + '<circle cx="-25" cy="-25" r="11" fill="'+K.bearD+'"/>'                  // tai
    + '<circle cx="25" cy="-25" r="11" fill="'+K.bearD+'"/>'
    + '<circle cx="-25" cy="-25" r="5.5" fill="'+K.muzzle+'"/>'
    + '<circle cx="25" cy="-25" r="5.5" fill="'+K.muzzle+'"/>'
    + '<circle cx="0" cy="0" r="31" fill="'+K.bear+'"/>'                       // đầu
    + '<ellipse cx="0" cy="12" rx="17" ry="13" fill="'+K.muzzle+'"/>'          // mõm
    + '<ellipse cx="0" cy="5" rx="5.5" ry="4" fill="'+K.dark+'"/>'             // mũi
    + eyes + mouth
    + (hatCol ? P.hat(0, -22, 0.92, hatCol) : '')
    + '</g>';
};

// Bạn Thỏ
P.rabbit = (x, y, s, hatCol) =>
  '<g transform="translate('+x+','+y+') scale('+s+')">'
  + '<ellipse cx="0" cy="62" rx="30" ry="27" fill="'+K.rab+'"/>'
  + '<ellipse cx="-13" cy="-40" rx="7.5" ry="23" fill="'+K.rab+'" transform="rotate(-9 -13 -40)"/>'
  + '<ellipse cx="13" cy="-40" rx="7.5" ry="23" fill="'+K.rab+'" transform="rotate(9 13 -40)"/>'
  + '<ellipse cx="-13" cy="-40" rx="3.6" ry="15" fill="'+K.pink+'" transform="rotate(-9 -13 -40)"/>'
  + '<ellipse cx="13" cy="-40" rx="3.6" ry="15" fill="'+K.pink+'" transform="rotate(9 13 -40)"/>'
  + '<circle cx="0" cy="0" r="26" fill="'+K.rab+'"/>'
  + '<circle cx="-10" cy="-4" r="3.2" fill="'+K.dark+'"/><circle cx="10" cy="-4" r="3.2" fill="'+K.dark+'"/>'
  + '<path d="M-4 8 h8 l-4 4 Z" fill="'+K.pink+'"/>'
  + '<path d="M0 12 q-6 6 -11 2 M0 12 q6 6 11 2" stroke="'+K.dark+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>'
  + (hatCol ? P.hat(0, -19, 0.8, hatCol) : '')
  + '</g>';

// Bạn Mèo
P.cat = (x, y, s, mood) => {
  const mouth = mood === 'happy'
    ? '<path d="M-7 13 q7 7 14 0" stroke="'+K.dark+'" stroke-width="2.3" fill="none" stroke-linecap="round"/>'
    : '<path d="M0 10 q-5 6 -10 2 M0 10 q5 6 10 2" stroke="'+K.dark+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  return '<g transform="translate('+x+','+y+') scale('+s+')">'
    + '<ellipse cx="0" cy="60" rx="28" ry="26" fill="'+K.cat+'"/>'
    + '<path d="M-42 74 q-16 -6 -12 -22" stroke="'+K.catD+'" stroke-width="9" fill="none" stroke-linecap="round"/>'
    + '<path d="M-24 -20 l-4 -24 l20 11 Z" fill="'+K.cat+'"/>'
    + '<path d="M24 -20 l4 -24 l-20 11 Z" fill="'+K.cat+'"/>'
    + '<path d="M-22 -19 l-2 -14 l12 6 Z" fill="'+K.pink+'"/>'
    + '<path d="M22 -19 l2 -14 l-12 6 Z" fill="'+K.pink+'"/>'
    + '<circle cx="0" cy="0" r="25" fill="'+K.cat+'"/>'
    + '<ellipse cx="-9" cy="-4" rx="3.2" ry="4" fill="'+K.dark+'"/><ellipse cx="9" cy="-4" rx="3.2" ry="4" fill="'+K.dark+'"/>'
    + '<path d="M-4 7 h8 l-4 4 Z" fill="'+K.pink+'"/>'
    + mouth
    + '<path d="M-14 6 h-14 M-14 11 h-13 M14 6 h14 M14 11 h13" stroke="'+K.catD+'" stroke-width="1.6" stroke-linecap="round"/>'
    + '</g>';
};

// Bàn ăn (có thể đặt mũ / bánh lên trên)
P.table = (x, y, s, on) =>
  '<g transform="translate('+x+','+y+') scale('+s+')">'
  + (on || '')
  + '<rect x="-58" y="0" width="116" height="11" rx="5" fill="'+K.wood+'"/>'
  + '<rect x="-46" y="11" width="10" height="40" rx="4" fill="'+K.woodD+'"/>'
  + '<rect x="36" y="11" width="10" height="40" rx="4" fill="'+K.woodD+'"/>'
  + '</g>';

P.cake = (x, y, s) =>
  '<g transform="translate('+x+','+y+') scale('+s+')">'
  + '<ellipse cx="0" cy="0" rx="17" ry="5" fill="#E8DFD0"/>'
  + '<path d="M-13 0 q13 -17 26 0 Z" fill="#E8C583"/>'
  + '<circle cx="0" cy="-11" r="3.2" fill="#D9707A"/>'
  + '</g>';

// Vòi nước ngoài vườn + giọt nước
P.tap = (x, y, s) =>
  '<g transform="translate('+x+','+y+') scale('+s+')">'
  + '<rect x="-5" y="-42" width="10" height="42" rx="4" fill="'+K.grey+'"/>'
  + '<rect x="-5" y="-42" width="26" height="9" rx="4" fill="'+K.greyD+'"/>'
  + '<rect x="14" y="-36" width="8" height="13" rx="3" fill="'+K.greyD+'"/>'
  + '<circle cx="-11" cy="-38" r="7" fill="'+K.greyD+'"/>'
  + '<ellipse cx="18" cy="-14" rx="3.4" ry="4.6" fill="'+K.water+'"/>'
  + '<ellipse cx="18" cy="-3" rx="2.6" ry="3.6" fill="'+K.water+'" opacity=".75"/>'
  + '</g>';

P.grassStrip = (y) =>

    + '<circle cx="0" cy="0" r="20" fill="#fff" stroke="'+K.greyD+'" stroke-width="3"/>'
    + '<line x1="0" y1="0" x2="'+(9*Math.cos(R(ha))).toFixed(1)+'" y2="'+(9*Math.sin(R(ha))).toFixed(1)+'" stroke="'+K.dark+'" stroke-width="3" stroke-linecap="round"/>'
    + '<line x1="0" y1="0" x2="'+(14*Math.cos(R(ma))).toFixed(1)+'" y2="'+(14*Math.sin(R(ma))).toFixed(1)+'" stroke="'+K.dark+'" stroke-width="2.2" stroke-linecap="round"/>'

function Q(topic, text, q, opts, answer, hint, lit, clue, icons){
  return { topic, art:'topic'+topic[0].toUpperCase()+topic.slice(1),
           text:text.split('|'), q, opts:opts.split('|'), answer, hint,
           lit:String(lit).split(',').map(Number), clue,
           icons: icons ? icons.split('|') : null };
}

/* ═══════════════════════════════════════════════════════════════════════
   PHẦN 3 — LOGIC GAME
   ═══════════════════════════════════════════════════════════════════════ */
let caseIdx = 0, sceneIdx = 0, solved = false;
let clues = [], allSentences = [], soundOn = true;

/* ── Chế độ chơi ──
   'story'    = 2 vụ án có cốt truyện (đoạn văn cộng dồn, có câu suy luận nối manh mối)
   'practice' = vòng luyện tập: 20 câu bốc ngẫu nhiên từ ngân hàng 100 câu    */
let mode = 'story';
let activeScenes = [];   // danh sách câu đang chơi
let activeMeta = {};     // {name, endArt, endText}

const ROUND_SIZE = 20;   // ⬅ số câu mỗi vòng. Bé mau mệt thì đổi xuống 10.

function shuffle(arr){
  const r = arr.slice();
  for(let i = r.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}

// Bốc 20 câu cho một vòng. Game NHỚ câu đã ra ⇒ 5 vòng đầu bé gặp đủ 100 câu
// khác nhau, không bị lặp. Hết 100 câu thì tự làm mới rồi bắt đầu lại.
function pickRound(){
  let seen = [];
  try{ seen = JSON.parse(localStorage.getItem('tt_seen') || '[]'); }catch(e){ seen = []; }
  if(!Array.isArray(seen)) seen = [];
  let pool = BANK.map((_, i) => i).filter(i => seen.indexOf(i) < 0);
  if(pool.length < ROUND_SIZE){ seen = []; pool = BANK.map((_, i) => i); }   // đã đi hết 100 câu → làm mới
  const chosen = shuffle(pool).slice(0, ROUND_SIZE);
  try{ localStorage.setItem('tt_seen', JSON.stringify(seen.concat(chosen))); }catch(e){}
  return chosen.map(i => BANK[i]);
}
// Xáo trộn THỨ TỰ ĐÁP ÁN của một câu.
// Vì sao cần: nếu đáp án đúng cứ hay rơi vào A hoặc B, bé sẽ học được "mẹo" đoán
// theo vị trí thay vì đọc hiểu. Xáo trộn xong thì chỉ còn cách đọc mới trả lời được.
// Hình minh hoạ của từng đáp án được chuyển theo cho khớp.
function shuffleOptions(sc){
  const idx = shuffle(sc.opts.map((_, i) => i));   // idx[vị trí mới] = vị trí cũ
  return Object.assign({}, sc, {
    opts:   idx.map(i => sc.opts[i]),
    icons:  sc.icons ? idx.map(i => sc.icons[i]) : null,
    answer: idx.indexOf(sc.answer),
  });
}

// Số câu bé đã gặp, để hiện ở màn hình đầu
function seenCount(){
  try{ const s = JSON.parse(localStorage.getItem('tt_seen') || '[]'); return Array.isArray(s) ? s.length : 0; }
  catch(e){ return 0; }
}

/* ═══════════════════════════════════════════════════════════════════════
   ÂM THANH & NHẠC NỀN
   Tất cả tự tạo bằng Web Audio + giọng đọc sẵn có của máy
   ⇒ KHÔNG cần file nhạc, vẫn chạy offline, file vẫn nhẹ.

   Có HAI nút tắt riêng, vì mỗi bé nhạy cảm với thứ khác nhau:
     🎵 Nhạc nền  — nhạc vui chạy nền trong lúc chơi
     🔔 Âm thanh  — tiếng khen / tiếng "ố ồ" / giọng đọc
   Bé khó chịu với cái nào thì tắt riêng cái đó, không mất luôn cả hai.
   Máy nhớ lựa chọn cho lần sau.

   Âm lượng để nhỏ, sóng mềm (sine/triangle), lên xuống êm — không tiếng chói.
   Nhạc nền tự nhỏ lại khi có tiếng khen hoặc giọng đọc, để nghe rõ lời.
   ═══════════════════════════════════════════════════════════════════════ */
const MUSIC_VOL = 0.12;      // độ to nhạc nền (0 = tắt, 1 = to nhất) — chỉnh ở đây nếu muốn to/nhỏ hơn
const BEAT = 0.28;           // độ dài 1 phách (giây) — số nhỏ hơn = nhạc nhanh hơn

let audioCtx = null, musicGain = null, sfxGain = null;
let sfxOn = true, musicOn = true;
let musicPlaying = false, musicNextAt = 0, musicTimer = null;

function ensureCtx(){
  if(audioCtx) return audioCtx;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    musicGain = audioCtx.createGain(); musicGain.gain.value = MUSIC_VOL; musicGain.connect(audioCtx.destination);
    sfxGain   = audioCtx.createGain(); sfxGain.gain.value = 1;           sfxGain.connect(audioCtx.destination);
  }catch(e){ audioCtx = null; }
  return audioCtx;
}

// Nốt nhạc → tần số (Hz)
const N = {
  F4:349.23, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, C6:1046.50,
  C3:130.81, D3:146.83, F3:174.61, G3:196.00,
};

function note(freq, at, dur, vol, type, dest){
  if(!audioCtx || !freq) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, at);
  g.gain.linearRampToValueAtTime(vol, at + 0.025);      // vào êm
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur); // tắt dần, không cắt cụt
  o.connect(g); g.connect(dest || sfxGain);
  o.start(at); o.stop(at + dur + 0.04);
}

/* ── Bản nhạc nền: vui, nhẹ, lặp lại (khoảng 9 giây/vòng) ──
   Mỗi phần tử = [tên nốt, số phách]. 0 = nghỉ. */
const MELODY = [
  ['C5',1],['E5',1],['G5',1],['E5',1],
  ['F5',1],['E5',1],['D5',2],
  ['D5',1],['F5',1],['A5',1],['F5',1],
  ['E5',1],['D5',1],['C5',2],
  ['E5',1],['G5',1],['E5',1],['C5',1],
  ['D5',1],['F5',1],['D5',1],['B4',1],
  ['C5',1],['E5',1],['G5',1],['A5',1],
  ['G5',2],[0,2],
];
const BASS = [['C3',4],['F3',4],['D3',4],['G3',4],['C3',4],['G3',4],['C3',4],['G3',4]];
const LOOP_BEATS = MELODY.reduce((s,[,b]) => s + b, 0);
const LOOP_LEN = LOOP_BEATS * BEAT;

function scheduleLoopAt(t0){
  let t = t0;
  MELODY.forEach(([n, b]) => {
    if(n) note(N[n], t, b * BEAT * 0.92, 0.5, 'triangle', musicGain);  // triangle = tiếng tròn như sáo
    t += b * BEAT;
  });
  t = t0;
  BASS.forEach(([n, b]) => {
    if(n) note(N[n], t, b * BEAT * 0.85, 0.4, 'sine', musicGain);
    t += b * BEAT;
  });
}

// Bộ lên lịch nhìn trước — nhạc chạy đều, không bị giật khi tab bận
function musicTick(){
  if(!musicPlaying || !audioCtx) return;
  const now = audioCtx.currentTime;
  while(musicNextAt < now + 1.5){
    scheduleLoopAt(Math.max(musicNextAt, now + 0.05));
    musicNextAt = Math.max(musicNextAt, now + 0.05) + LOOP_LEN;
  }
  musicTimer = setTimeout(musicTick, 500);
}
function startMusic(){
  if(!musicOn || musicPlaying || !ensureCtx()) return;
  try{ audioCtx.resume(); }catch(e){}
  musicPlaying = true;
  musicNextAt = audioCtx.currentTime + 0.1;
  musicTick();
}
function stopMusic(){
  musicPlaying = false;
  if(musicTimer){ clearTimeout(musicTimer); musicTimer = null; }
  if(musicGain && audioCtx){
    // tắt dần chứ không cắt phựt
    const t = audioCtx.currentTime;
    musicGain.gain.cancelScheduledValues(t);
    musicGain.gain.setTargetAtTime(0, t, 0.15);
    setTimeout(() => { if(!musicPlaying && musicGain) musicGain.gain.value = MUSIC_VOL; }, 900);
  }
}
// Hạ nhạc nền xuống trong lúc có tiếng khen / giọng đọc, rồi trả lại như cũ
function duck(ms){
  if(!musicGain || !audioCtx || !musicPlaying) return;
  const t = audioCtx.currentTime;
  musicGain.gain.cancelScheduledValues(t);
  musicGain.gain.setTargetAtTime(MUSIC_VOL * 0.22, t, 0.06);
  musicGain.gain.setTargetAtTime(MUSIC_VOL, t + (ms || 1400) / 1000, 0.25);
}

/* ── Giọng đọc: dùng giọng tiếng Việt có sẵn trong máy ──
   Máy KHÔNG có giọng tiếng Việt thì bỏ qua phần đọc (chữ vẫn hiện trên màn hình),
   chứ không đọc tiếng Việt bằng giọng nước ngoài — nghe sai, bé khó hiểu. */
let viVoice = null;
function loadVoices(){
  try{
    const vs = window.speechSynthesis.getVoices() || [];
    viVoice = vs.find(v => /^vi\b|^vi-/i.test(v.lang || '')) ||
              vs.find(v => /vietnam/i.test((v.name || '') + (v.lang || ''))) || null;
  }catch(e){ viVoice = null; }
}
if(typeof window !== 'undefined' && 'speechSynthesis' in window){
  loadVoices();
  try{ window.speechSynthesis.onvoiceschanged = loadVoices; }catch(e){}
}
function speak(text){
  if(!sfxOn || typeof window === 'undefined' || !('speechSynthesis' in window)) return;
  if(!viVoice) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.voice = viVoice; u.lang = viVoice.lang || 'vi-VN';
    u.rate = 0.95; u.pitch = 1.12; u.volume = 1;   // hơi cao giọng cho vui tai, nói chậm vừa phải
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ── Các tiếng trong game ── */
// ĐÚNG: kèn chiến thắng đi lên + lời khen
const CHEERS = ['Yeah! Bạn đã chiến thắng rồi!', 'Yeah! Bạn giỏi quá!', 'Tuyệt vời! Bạn đúng rồi!'];
let cheerIdx = 0;
function playCorrect(){
  if(!sfxOn || !ensureCtx()) return;
  const t = audioCtx.currentTime + 0.02;
  [['C5',0],['E5',0.09],['G5',0.18],['C6',0.27]].forEach(([n,d]) => note(N[n], t+d, 0.32, 0.17, 'triangle'));
  note(N.G5, t + 0.44, 0.45, 0.09, 'sine');
  duck(1800);
  speak(CHEERS[cheerIdx++ % CHEERS.length]);
}
// CHƯA ĐÚNG: "ố ồ" — hai nốt đi xuống, mềm, KHÔNG phải tiếng còi báo lỗi
function playWrong(){
  if(!sfxOn || !ensureCtx()) return;
  const t = audioCtx.currentTime + 0.02;
  note(N.A4, t,        0.22, 0.12, 'triangle');
  note(N.F4, t + 0.20, 0.34, 0.11, 'triangle');
  duck(1100);
  speak('Ố ồ');
}
// XONG VỤ ÁN: kèn dài hơn + lời chúc mừng
function playFinish(){
  if(!sfxOn || !ensureCtx()) return;
  const t = audioCtx.currentTime + 0.02;
  [['C5',0],['E5',0.10],['G5',0.20],['C6',0.30],['G5',0.44],['C6',0.56]].forEach(([n,d]) =>
    note(N[n], t+d, 0.36, 0.16, 'triangle'));
  note(N.C6, t + 0.72, 0.9, 0.12, 'sine');
  note(N.E5, t + 0.72, 0.9, 0.07, 'sine');
  duck(2600);
  speak('Chúc mừng bạn! Bạn là một thám tử tuyệt vời!');
}

/* ── Hai nút bật/tắt ── */
function setSoundLabel(){
  document.getElementById('soundIcon').textContent = sfxOn ? '🔔' : '🔕';
  document.getElementById('soundText').textContent = 'Âm thanh: ' + (sfxOn ? 'Bật' : 'Tắt');
  document.getElementById('musicIcon').textContent = musicOn ? '🎵' : '🔇';
  document.getElementById('musicText').textContent = 'Nhạc: ' + (musicOn ? 'Bật' : 'Tắt');
}
function toggleSound(){
  sfxOn = !sfxOn;
  soundOn = sfxOn;
  localStorage.setItem('tt_sound', sfxOn ? '1' : '0');
  setSoundLabel();
  if(sfxOn){ ensureCtx(); note(660, (audioCtx ? audioCtx.currentTime : 0) + 0.02, 0.18, 0.09, 'triangle'); }
  else { try{ window.speechSynthesis.cancel(); }catch(e){} }
}
function toggleMusic(){
  musicOn = !musicOn;
  localStorage.setItem('tt_music', musicOn ? '1' : '0');
  setSoundLabel();
  if(musicOn) startMusic(); else stopMusic();
}
(function initSound(){
  if(localStorage.getItem('tt_sound') === '0'){ sfxOn = false; soundOn = false; }
  if(localStorage.getItem('tt_music') === '0') musicOn = false;
  setSoundLabel();
})();

/* ── Nhân vật Kính Lúp ── */
function magnifier(mood){
  const glow = mood === 'happy';
  const eye = glow
    ? '<path d="M40 52 q6 -7 12 0" stroke="#2E3D50" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
      + '<path d="M62 52 q6 -7 12 0" stroke="#2E3D50" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
    : '<circle cx="46" cy="53" r="4.6" fill="#2E3D50"/><circle cx="68" cy="53" r="4.6" fill="#2E3D50"/>';
  const mouth = glow
    ? '<path d="M45 64 q12 13 24 0" stroke="#2E3D50" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
    : (mood === 'think'
      ? '<path d="M48 68 q9 -5 18 0" stroke="#2E3D50" stroke-width="4.5" fill="none" stroke-linecap="round"/>'
      : '<path d="M47 65 q10 9 20 0" stroke="#2E3D50" stroke-width="4.5" fill="none" stroke-linecap="round"/>');
  return '<svg viewBox="0 0 120 120" width="100%" height="100%" role="img" aria-label="Nhân vật kính lúp">'
    + '<rect x="72" y="78" width="15" height="34" rx="7.5" transform="rotate(-45 79 95)" fill="#B98A5E"/>'
    + '<circle cx="57" cy="57" r="41" fill="' + (glow ? '#FFF6DC' : '#EAF2F8') + '" stroke="' + (glow ? '#E4B84D' : '#4B7BA8') + '" stroke-width="8"/>'
    + (glow ? '<circle cx="57" cy="57" r="49" fill="none" stroke="#F2D89A" stroke-width="3" opacity=".85"/>' : '')
    + eye + mouth + '</svg>';
}
document.getElementById('heroStart').innerHTML = magnifier('normal');

// Ảnh bìa 2 vụ án ở màn hình đầu
document.getElementById('coversBox').innerHTML = CASES.map(c =>
  '<div class="cover"><div class="pic">' + ART[c.cover]() + '</div><div class="cap">' + c.name + '</div></div>').join('')
  + '<div class="cover"><div class="pic">' + ART.topicThink() + '</div><div class="cap">Vòng luyện tập · ' + ROUND_SIZE + ' câu</div></div>';

(function showModeHint(){
  const el = document.getElementById('modeHint'); if(!el) return;
  const left = Math.max(0, BANK.length - seenCount());
  el.innerHTML = '<b>🔍 Vụ án có cốt truyện</b>: đọc truyện dài, có câu suy luận — 4 câu mỗi vụ.<br>'
    + '<b>⭐ Vòng luyện tập</b>: ' + ROUND_SIZE + ' câu đố ngắn, xáo trộn mỗi lần chơi'
    + (left > 0 ? ' — còn <b>' + left + '</b> câu bé chưa gặp trong tổng số ' + BANK.length + ' câu.'
                : ' — bé đã đi hết ' + BANK.length + ' câu, vòng sau sẽ bắt đầu lại từ đầu.');
})();

function show(id){
  ['screenStart','screenPlay','screenEnd'].forEach(s =>
    document.getElementById(s).classList.toggle('hide', s !== id));
  window.scrollTo({top:0, behavior:'smooth'});
}
// Bấm nút ở màn hình đầu = thao tác cho phép phát tiếng (trình duyệt bắt buộc phải có)
function unlockAudio(){
  ensureCtx();
  try{ if(audioCtx) audioCtx.resume(); }catch(e){}
  startMusic();
}
function startGame(){          // 2 vụ án có cốt truyện
  unlockAudio();
  mode = 'story'; caseIdx = 0; newCase();
}
function startPractice(){      // vòng luyện tập: 20 câu xáo trộn
  unlockAudio();
  mode = 'practice';
  activeScenes = pickRound().map(shuffleOptions);
  activeMeta = { name:'Vòng luyện tập',
                 endArt:'practiceDone',
                 endText:'Bạn đã giải xong ' + ROUND_SIZE + ' câu đố. Nghỉ một chút rồi chơi vòng mới với những câu khác nhé!' };
  resetRound();
}
function newCase(){            // bắt đầu 1 vụ án có cốt truyện
  activeScenes = CASES[caseIdx].scenes.map(shuffleOptions);   // bản sao, KHÔNG sửa dữ liệu gốc
  activeMeta = CASES[caseIdx];
  resetRound();
}
function resetRound(){
  sceneIdx = 0; clues = []; allSentences = [];
  document.getElementById('storyBox').innerHTML = '';
  show('screenPlay');
  renderScene();
}

function renderScene(){
  const sc = activeScenes[sceneIdx];
  solved = false;

  // Luyện tập: mỗi câu độc lập ⇒ xoá đoạn văn cũ, chỉ hiện đoạn của câu này
  // (Vụ án có cốt truyện thì giữ lại đoạn cũ để bé đọc lại và nối manh mối.)
  if(mode === 'practice'){
    document.getElementById('storyBox').innerHTML = '';
    allSentences = [];
  }

  // Hình minh hoạ của đoạn đang đọc (chỉ hiện 1 hình → không rối mắt)
  document.getElementById('scenePic').innerHTML = ART[sc.art] ? ART[sc.art]() : '';

  // Đoạn văn MỚI nối vào cuối; đoạn cũ vẫn còn để bé đọc lại
  const box = document.getElementById('storyBox');
  const p = document.createElement('p');
  p.innerHTML = (sceneIdx > 0 && mode === 'story' ? '<span class="newtag">MỚI</span>' : '')
    + sc.text.map(s => {
        allSentences.push(s);
        return '<span class="s" data-i="' + (allSentences.length-1) + '">' + s + '</span>';
      }).join(' ');
  box.appendChild(p);

  document.getElementById('heroPlay').innerHTML = magnifier('think');
  document.getElementById('questionBox').textContent = sc.q;

  const opts = document.getElementById('optsBox');
  opts.innerHTML = '';
  sc.opts.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    const iconName = sc.icons ? sc.icons[i] : null;
    const pic = (iconName && ICON[iconName]) ? '<span class="optpic">' + ICON[iconName]() + '</span>' : '';
    b.innerHTML = '<span class="kbd">' + 'ABCD'[i] + '</span>' + pic + '<span>' + text + '</span>';
    b.onclick = () => choose(i, b);
    opts.appendChild(b);
  });

  const fb = document.getElementById('feedbackBox');
  fb.className = 'feedback'; fb.textContent = '';
  const nb = document.getElementById('nextBtn');
  nb.classList.remove('show');
  nb.textContent = (sceneIdx < activeScenes.length - 1) ? 'Tiếp theo →' : 'Xem kết quả →';

  clearHighlight();
  renderProgress();
}

function choose(i, btn){
  if(solved) return;
  const sc = activeScenes[sceneIdx];
  const fb = document.getElementById('feedbackBox');

  if(i === sc.answer){
    solved = true;
    btn.classList.add('correct'); btn.classList.remove('tried');
    document.querySelectorAll('#optsBox .opt').forEach(b => b.disabled = true);
    document.getElementById('heroPlay').innerHTML = magnifier('happy');
    clearHighlight();
    fb.className = 'feedback show ok';
    fb.textContent = '✓ Đúng rồi! Bạn đọc rất kỹ.';
    clues.push(sc.clue);
    playCorrect();
    document.getElementById('nextBtn').classList.add('show');
    renderProgress();
  } else {
    // Chưa đúng: KHÔNG phạt, KHÔNG dấu X đỏ. Gợi ý + tô sáng câu cần đọc lại.
    btn.classList.add('tried');
    fb.className = 'feedback show hint';
    fb.innerHTML = '💡 <b>Gần đúng rồi.</b> ' + sc.hint
      + '<br><span style="font-weight:500">Câu cần đọc lại đang được tô màu vàng bên trái. Bạn thử chọn lại nhé.</span>';
    highlight(sc.lit);
    playWrong();   // "ố ồ" — hai nốt đi xuống, nhẹ nhàng
  }
}

function highlight(list){
  clearHighlight();
  (list || []).forEach(i => {
    const el = document.querySelector('.story .s[data-i="' + i + '"]');
    if(el) el.classList.add('lit');
  });
  const first = document.querySelector('.story .s.lit');
  if(first) first.scrollIntoView({behavior:'smooth', block:'center'});
}
function clearHighlight(){
  document.querySelectorAll('.story .s.lit').forEach(el => el.classList.remove('lit'));
}

function renderProgress(){
  const total = activeScenes.length, done = clues.length;
  document.getElementById('progressLabel').textContent = (mode === 'practice')
    ? ('Bạn đã làm được ' + done + '/' + total + ' câu')
    : ('Bạn đã tìm được ' + done + '/' + total + ' gợi ý');
  const dots = document.getElementById('dotsBox');
  dots.className = 'dots' + (total > 8 ? ' many' : '');
  dots.innerHTML = '';
  for(let i = 0; i < total; i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < done ? ' done' : (i === sceneIdx && !solved ? ' now' : ''));
    dots.appendChild(d);
  }
  // Luyện tập 20 câu thì chỉ hiện 3 dòng gần nhất, kẻo sổ tay quá dài
  const shown = (mode === 'practice') ? clues.slice(-3) : clues;
  const more = clues.length - shown.length;
  document.getElementById('notebookBox').innerHTML = clues.length
    ? '<b>📓 Sổ tay thám tử:</b>' + (more > 0 ? ' <span style="color:var(--ink3)">(và ' + more + ' dòng trước đó)</span>' : '')
      + '<ul>' + shown.map(c => '<li>' + c + '</li>').join('') + '</ul>'
    : '<b>📓 Sổ tay thám tử:</b> còn trống. Trả lời đúng để ghi vào đây nhé.';
}

function nextScene(){
  if(sceneIdx < activeScenes.length - 1){
    sceneIdx++;
    renderScene();
    document.getElementById('questionBox').scrollIntoView({behavior:'smooth', block:'center'});
  } else {
    endCase();
  }
}

function endCase(){
  const c = activeMeta;
  document.getElementById('endArt').innerHTML = ART[c.endArt] ? ART[c.endArt]() : '';
  document.getElementById('endTitle').textContent = 'Chúc mừng bạn! Bạn là một thám tử tuyệt vời!';
  document.getElementById('endText').textContent = c.endText;
  document.getElementById('endNotebook').innerHTML =
    '<b>📓 Những điều bạn đã tìm được:</b><ul>' + clues.map(x => '<li>' + x + '</li>').join('') + '</ul>';

  const btns = document.getElementById('endButtons');
  btns.innerHTML = '';
  const mkBtn = (cls, label, fn) => { const b = document.createElement('button'); b.className = cls; b.textContent = label; b.onclick = fn; btns.appendChild(b); };

  if(mode === 'practice'){
    mkBtn('btn2 primary', '⭐ Vòng mới (' + ROUND_SIZE + ' câu khác) →', () => startPractice());
    mkBtn('btn2', '🔍 Chơi vụ án có cốt truyện', () => startGame());
  } else {
    const more = caseIdx < CASES.length - 1;
    if(more) mkBtn('btn2 primary', 'Vụ án tiếp theo: ' + CASES[caseIdx+1].name + ' →', () => { caseIdx++; newCase(); });
    mkBtn('btn2' + (more ? '' : ' primary'), '↻ Chơi lại vụ án này', () => newCase());
    mkBtn('btn2', '⭐ Vòng luyện tập ' + ROUND_SIZE + ' câu', () => startPractice());
  }

  const home = document.createElement('button');
  home.className = 'btn2';
  home.textContent = '🏠 Về trang đầu';
  home.onclick = () => show('screenStart');
  btns.appendChild(home);

  show('screenEnd');
  playFinish();
}
</script>
</body>
</html>
